version: '3.8'

services:
  # Certificate Authority (CA)
  ca.siladocs.com:
    image: hyperledger/fabric-ca:latest
    container_name: ca.siladocs.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-siladocs
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    volumes:
      - ca-volume:/etc/hyperledger/fabric-ca-server
    networks:
      - siladocs-fabric

  # Orderer
  orderer.siladocs.com:
    image: hyperledger/fabric-orderer:latest
    container_name: orderer.siladocs.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
    ports:
      - "7050:7050"
    volumes:
      - orderer-volume:/var/hyperledger/orderer
    networks:
      - siladocs-fabric
    depends_on:
      - ca.siladocs.com

  # CouchDB for Peer
  couchdb:
    image: couchdb:latest
    container_name: couchdb
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    volumes:
      - couchdb-volume:/opt/couchdb/data
    networks:
      - siladocs-fabric

  # Peer0 Org1
  peer0.org1.siladocs.com:
    image: hyperledger/fabric-peer:latest
    container_name: peer0.org1.siladocs.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric-network_siladocs-fabric
      - CORE_PEER_ID=peer0.org1.siladocs.com
      - CORE_PEER_ADDRESS=peer0.org1.siladocs.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.siladocs.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.siladocs.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.siladocs.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp/peer/
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    ports:
      - "7051:7051"
      - "7052:7052"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - peer-volume:/var/hyperledger/production
    networks:
      - siladocs-fabric
    depends_on:
      - ca.siladocs.com
      - orderer.siladocs.com
      - couchdb

volumes:
  ca-volume:
  orderer-volume:
  peer-volume:
  couchdb-volume:

networks:
  siladocs-fabric:
    driver: bridge
