version: '3.8'

services:
  # ============================================================================
  # Fabric Middleware - API REST (Python FastAPI)
  # ============================================================================
  fabric-middleware:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fabric-middleware
    ports:
      - "8000:8000"
    environment:
      - MIDDLEWARE_HOST=0.0.0.0
      - MIDDLEWARE_PORT=8000
      - MIDDLEWARE_RELOAD=False
      - LOG_LEVEL=INFO
      # Actualizar estas variables cuando tengas red Fabric real
      - FABRIC_API_URL=http://fabric-ca:7054
    volumes:
      # Para desarrollo local, montar el código fuente
      - .:/app
      # Para producción, comentar la línea anterior
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - siladocs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      # Agregar dependencias de Fabric aquí cuando tengas servicios reales
      - fake-fabric-service

  # ============================================================================
  # Servicio Fake Fabric (para MVP/Testing)
  # REMOVER esto cuando tengas red Fabric real
  # ============================================================================
  fake-fabric-service:
    image: alpine:latest
    container_name: fake-fabric-service
    command: sleep 3600
    networks:
      - siladocs-network


networks:
  siladocs-network:
    driver: bridge

volumes: {}
