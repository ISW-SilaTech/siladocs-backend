server:
  servlet:
    context-path: /api

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER:your-gmail@gmail.com}
    password: ${GMAIL_PASSWORD:your-app-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

siladocs:
  jwt:
    secret: ${JWT_SECRET:siladocs-jwt-secret-key-2024-minimum-32-bytes-long-secure}
    expiration-ms: 86400000
  storage:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: siladocs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  frontend:
    reset-url: http://localhost:3000/reset-password

blockchain:
  fabric:
    api:
      url: ${FABRIC_API_URL:http://localhost:8000}
    mock:
      enabled: ${BLOCKCHAIN_MOCK_ENABLED:false}

contact:
  admin-email: ${CONTACT_ADMIN_EMAIL:admin@siladocs.com}
  from-email: ${GMAIL_USER:your-gmail@gmail.com}
  from-name: Siladocs

recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY:your-secret-key}
  site-key: ${RECAPTCHA_SITE_KEY:your-site-key}
  score-threshold: 0.5
