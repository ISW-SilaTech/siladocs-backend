server:
  servlet:
    context-path: /api
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /api/v3/api-docs/swagger-config
    url: /api/v3/api-docs
    disable-swagger-default-url: true

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.rest.RepositoryRestMvcAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER:your-gmail@gmail.com}
    password: ${GMAIL_PASSWORD:your-app-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

siladocs:
  jwt:
    secret: ${JWT_SECRET:siladocs-jwt-secret-key-2024-minimum-32-bytes-long-secure}
    expiration-ms: 86400000
  storage:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: siladocs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  frontend:
    reset-url: http://localhost:3000/reset-password

blockchain:
  fabric:
    api:
      url: ${FABRIC_API_URL:http://localhost:8000}
    mock:
      enabled: ${BLOCKCHAIN_MOCK_ENABLED:false}

contact:
  admin-email: ${CONTACT_ADMIN_EMAIL:admin@siladocs.com}
  from-email: ${GMAIL_USER:your-gmail@gmail.com}
  from-name: Siladocs

recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY:your-secret-key}
  site-key: ${RECAPTCHA_SITE_KEY:your-site-key}
  score-threshold: 0.5

azure:
  blob-storage:
    connection-string: ${AZURE_BLOB_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=siladocsblob;AccountKey=your-account-key;EndpointSuffix=core.windows.net}
    container-name: ${AZURE_BLOB_CONTAINER_NAME:syllabi}
    account-name: ${AZURE_BLOB_ACCOUNT_NAME:siladocsblob}
    account-key: ${AZURE_BLOB_ACCOUNT_KEY:your-account-key}
    sas-expiry-hours: ${AZURE_BLOB_SAS_EXPIRY_HOURS:24}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:https://siladocs-frontend.vercel.app/oauth/google/callback}

microsoft:
  oauth:
    client-id: ${MICROSOFT_CLIENT_ID:}
    client-secret: ${MICROSOFT_CLIENT_SECRET:}
    tenant-id: ${MICROSOFT_TENANT_ID:common}
    redirect-uri: ${MICROSOFT_REDIRECT_URI:https://siladocs-frontend.vercel.app/oauth/onedrive/callback}
