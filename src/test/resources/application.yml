spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 25
    username: test@test.com
    password: test
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

siladocs:
  jwt:
    secret: test-jwt-secret-key-2024-minimum-32-bytes-long-secure
    expiration-ms: 86400000
  storage:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test
    bucket: test

blockchain:
  fabric:
    api:
      url: http://localhost:8000
    mock:
      enabled: true

recaptcha:
  secret-key: test-secret-key
  site-key: test-site-key
  score-threshold: 0.5

contact:
  admin-email: admin@test.com
  from-email: test@test.com
  from-name: Test

app:
  frontend:
    reset-url: http://localhost:3000/reset-password
