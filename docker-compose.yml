version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: siladocs
      POSTGRES_USER: siladocs
      POSTGRES_PASSWORD: siladocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - siladocs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siladocs"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - siladocs-network

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    networks:
      - siladocs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  fabric-middleware:
    image: siladocs-fabric-middleware:latest
    container_name: fabric-middleware
    build:
      context: ./fabric-middleware
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - siladocs-network
    environment:
      - FABRIC_API_URL=http://fabric-middleware:8000

  backend:
    build: .
    container_name: siladocs-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=fabric
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/siladocs
      - SPRING_DATASOURCE_USERNAME=siladocs
      - SPRING_DATASOURCE_PASSWORD=siladocs
      - FABRIC_API_URL=http://fabric-middleware:8000
    networks:
      - siladocs-network

volumes:
  pgdata:
  minio-data:

networks:
  siladocs-network:
    driver: bridge

# Agregar en docker-compose.yml
  fabric-network:
    build:
      context: ./fabric-network/fabric-samples/test-network
    environment:
      - COMPOSE_PROJECT_NAME=fabric
    networks:
      - siladocs-network
