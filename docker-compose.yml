version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: siladocs
      POSTGRES_USER: siladocs
      POSTGRES_PASSWORD: siladocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - siladocs-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - siladocs-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9005:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - siladocs-network

  fabric-middleware:
    build:
      context: ./fabric-middleware
      dockerfile: Dockerfile
    container_name: siladocs-fabric-middleware
    ports:
      - "8000:8000"
    environment:
      - MIDDLEWARE_HOST=0.0.0.0
      - MIDDLEWARE_PORT=8000
      - LOG_LEVEL=INFO
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - siladocs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build: .
    container_name: siladocs-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio
      - fabric-middleware
    environment:
      - SPRING_PROFILES_ACTIVE=fabric
      - FABRIC_API_URL=http://fabric-middleware:8000
    networks:
      - siladocs-network

volumes:
  pgdata:
  minio-data:

networks:
  siladocs-network:
    driver: bridge
